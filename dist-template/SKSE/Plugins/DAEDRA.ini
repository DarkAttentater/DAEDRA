; DAEDRA settings. Lines starting with ; or # are comments.

; trace, debug, info, warn, error
logLevel = info

; Write every rule hit to the log (noisy, useful while writing rules)
logMatches = false

; Dump every active effect with its full source chain each time the Magic menu opens.
; Turn this on while writing rules: it is how you find the form IDs and names to write rules against.
dumpActiveEffects = false

; Treat unknown keys in rule files as errors (the rule is skipped) instead of warnings
strict = false

; Apply matching rules to the Active Effects rows in the Magic menu
applyToMenu = true

; Hotkeys, DirectInput scan codes (0 = off). 0x41 = F7, 0x42 = F8.
; dumpKey: dump active effects now, plus the Scaleform structure of the open Magic menu
; reloadKey: re-read the rule files without restarting the game
dumpKey = 0
reloadKey = 0

; When a rule makes a row show another form's icon (iconFromWorn / iconFromSource / iconAsForm), also copy that form's
; type and keywords onto the row so PNGII treats it exactly like the item. Turn off if row tooltips misbehave.
iconMimicType = true
